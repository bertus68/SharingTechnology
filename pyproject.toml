[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharing-platform"
version = "0.1.0"
description = "Sharing Platform Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn"
]

[tool.setuptools.packages.find]
where = ["src"]

